name: Publier les données

# La tâche planifiée écrit uniquement dans le dépôt public Y-Mrt/veille-remorques-donnees
# (l'app GitHub de Claude n'a accès qu'à ce dépôt-là).
# Ce workflow, qui tourne ici depuis main, n'en reprend QUE annonces.json, le vérifie
# avec le script de ce dépôt, le copie dans docs/data/ puis redéploie le site.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: publier-donnees
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.copie.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Récupérer et vérifier les annonces
        run: |
          git clone --quiet --depth 1 https://github.com/Y-Mrt/veille-remorques-donnees "$RUNNER_TEMP/donnees"
          python3 -I scripts/validate_annonces.py "$RUNNER_TEMP/donnees/annonces.json"
          cp "$RUNNER_TEMP/donnees/annonces.json" docs/data/annonces.json
          # Message du dernier passage, nettoyé (lettres, chiffres, espaces, ponctuation simple).
          MSG=$(git -C "$RUNNER_TEMP/donnees" log -1 --format=%s | tr -cd '[:alnum:] :/._-' | head -c 80)
          echo "MSG=$MSG" >> "$GITHUB_ENV"

      - name: Copier sur main
        id: copie
        run: |
          if git diff --quiet; then echo "Rien de nouveau"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "veille-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Données : $MSG" docs/data/annonces.json
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deployer:
    needs: publier
    if: needs.publier.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
