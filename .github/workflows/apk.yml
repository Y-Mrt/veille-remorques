name: Compiler l'APK Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Compiler
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then SITE="https://$OWNER.github.io/"; else SITE="https://$OWNER.github.io/$REPO/"; fi
          echo "Adresse du site : $SITE"
          set -o pipefail
          if ! gradle -p android assembleRelease -PsiteUrl="$SITE" --no-daemon 2>&1 | tee build.log; then
            # Rend les erreurs lisibles dans les annotations du job.
            grep -E "error:|e: |What went wrong|FAILURE|Could not|> " build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp android/app/build/outputs/apk/release/app-release.apk veille-remorques.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Application Android ${{ github.run_number }}
          body: Installez veille-remorques.apk sur le téléphone (autoriser l'installation depuis le navigateur si Android le demande).
          files: veille-remorques.apk
          make_latest: true
