name: Compiler l'APK Android

# Lancement manuel uniquement (onglet Actions → Run workflow) : aucune modification
# poussée sur le dépôt ne peut produire toute seule une nouvelle version de l'app.
on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier l'APK dans les Releases (décocher pour un simple essai de compilation)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD absents (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/veille.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/veille.p12" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.11.1"

      - name: Compiler
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then SITE="https://$OWNER.github.io/"; else SITE="https://$OWNER.github.io/$REPO/"; fi
          set -o pipefail
          if ! gradle -p android assembleRelease -PsiteUrl="$SITE" --no-daemon 2>&1 | tee build.log; then
            grep -E "error:|e: |What went wrong|FAILURE|Could not|> " build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp android/app/build/outputs/apk/release/app-release.apk veille-remorques.apk
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Publier la version
        if: inputs.publier
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Application Android ${{ github.run_number }}
          body: Installez veille-remorques.apk sur le téléphone (autoriser l'installation depuis le navigateur si Android le demande).
          files: veille-remorques.apk
          make_latest: true
