plugins {
    id 'com.android.application'
}

def site = project.findProperty('siteUrl') ?: 'https://example.github.io/veille-remorques/'
if (!site.endsWith('/')) site = site + '/'

android {
    namespace 'fr.veille.remorques'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.veille.remorques'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        buildConfigField 'String', 'SITE_URL', "\"${site}\""
    }

    signingConfigs {
        release {
            // La clé n'est jamais dans le dépôt : le workflow la reconstitue à partir
            // des secrets GitHub ANDROID_KEYSTORE_B64 et ANDROID_KEYSTORE_PASSWORD.
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'veille'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
}
